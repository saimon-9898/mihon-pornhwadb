name: Build extension APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed: the wrapper task could not be run on the
      # device this repo was authored on, so Gradle is installed explicitly here
      # instead. Pinning the version keeps the build reproducible either way.
      - name: Install Gradle
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.14/bin" >> "$GITHUB_PATH"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true

      - name: Build extension
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pornhwadb-extension-apk
          path: pornhwadb/build/outputs/apk/debug/*.apk
          if-no-files-found: error