android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# Mihon provides the Kotlin stdlib. The plugin would otherwise bundle a second copy
# into the extension dex; loaded into the host process that is a class conflict, and
# it is why extensions must stay a few KB rather than a few MB.
kotlin.stdlib.default.dependency=false